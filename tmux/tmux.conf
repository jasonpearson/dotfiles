# Prefix
set -g prefix C-a
set -g prefix2 C-b
bind -N "Send prefix" C-a send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel
bind -N "Focus pane left" -T copy-mode-vi C-h select-pane -L
bind -N "Focus pane down" -T copy-mode-vi C-j select-pane -D
bind -N "Focus pane up" -T copy-mode-vi C-k select-pane -U
bind -N "Focus pane right" -T copy-mode-vi C-l select-pane -R

# Pane Controls
bind -N "Split pane vertically" s split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind -N "Focus pane left" -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -N "Focus pane down" -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -N "Focus pane up" -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -N "Focus pane right" -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5
bind -N "Resize pane left" C-h resize-pane -L 7
bind -N "Resize pane down" C-j resize-pane -D 7
bind -N "Resize pane up" C-k resize-pane -U 7
bind -N "Resize pane right" C-l resize-pane -R 7

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
run-shell 'tmux set -g default-shell "$(command -v bash)"'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status on
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
# Focused agent, otherwise first agent in pane order, otherwise focused directory.
# Select by pane ID, not by splitting title text (names may contain punctuation).
# Agents supply pane titles; only tmux's automatic renamer owns window names.
set -g @window_first_agent '#{s| .*||:#{P:#{?#{E:@pane_is_agent},#{pane_id} ,}}}'
set -g @window_agent_name '#{P:#{?#{==:#{pane_id},#{E:@window_first_agent}},#{E:@pane_window_name},}}'
set -gw automatic-rename-format '#{?#{E:@pane_is_agent},#{E:@pane_window_name},#{?#{E:@window_first_agent},#{E:@window_agent_name},#{E:@pane_window_name}}}'
# The native renamer normally watches only the active pane. Recheck when a
# background agent changes title or the pane layout changes; respect prefix+r.
set-hook -g pane-title-changed[90] {
    if-shell -F '#{!=:#{pane_current_command},pi}' 'set-option -pqu @pi_title'
    if-shell -F '#{automatic-rename}' 'set-window-option automatic-rename on'
}
set-hook -g window-layout-changed[90] { if-shell -F '#{automatic-rename}' 'set-window-option automatic-rename on' }
set-hook -g pane-died[90] { if-shell -F '#{automatic-rename}' 'set-window-option automatic-rename on' }
set -g set-titles on
set -g set-titles-string '#h:#W'

# ANSI safety colors before the generated RGB palette is available. User
# options cannot be shadowed by stale per-session shell environments.
set -g @theme_background black
set -g @theme_accent blue
set -g @theme_muted brightblack
set -g @theme_error red
set -g @theme_git_segment white
set -g @theme_status_background brightblack
setw -g clock-mode-colour blue
# Registers this socket so Omarchy/manual changes reach named servers too.
# Only palette options are reloaded; no plugin or keybinding reinitialization.
run-shell 'python3 "$HOME/.config/dotfiles/theme/apply.py" --tmux-socket #{q:socket_path}'
set -g status-style "bg=#{@theme_status_background},fg=#{@theme_background}"
set -g status-left "#{?window_zoomed_flag,#[fg=#{@theme_background}]#[bg=#{@theme_error}]#[bold] Z #[default] ,}#{?#{T:@attention_global},#[fg=#{@theme_git_segment}]#[bg=#{@theme_background}]#[bold] #{T:@attention_global},}#[fg=#{@theme_background},bg=#{@theme_status_background},bold] [#S]#[default] "
set -g status-right "#[fg=#{@theme_background}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#h"
set -g window-status-format "#[fg=#{@theme_background},bg=#{@theme_status_background},bold] #{T:@attention_window}#I:#{qh:window_name} "
set -g window-status-current-format "#[fg=#{@theme_git_segment},bg=#{@theme_background},bold] #{T:@attention_window}#I:#{qh:window_name} "
set -g pane-border-style "fg=#{@theme_muted}"
set -g pane-active-border-style "fg=#{@theme_accent}"
set -g pane-border-status top
set -g @pane_ssh_title '#{&&:#{==:#{pane_current_command},ssh},#{m:* (*),#{pane_title}}}'
set -g @pane_home_path '#{s|#{HOME}|~|:pane_current_path}'
set -g @pane_border_path '#{?#{E:@pane_ssh_title},#{s| \([^()]*\)$||:pane_title},#{E:@pane_home_path}}'
set -g @pane_border_host '#{s|jason-pearson-||:#{?#{E:@pane_ssh_title},#{s|^.*\(([^()]*)\)$|\1|:pane_title},#{?#{@ssh_host},#{@ssh_host},#{host_short}}}}'
set -g @pane_host_path '#{E:@pane_border_host}:#{E:@pane_border_path}'
set -g @pane_is_agent '#{&&:#{!:#{pane_dead}},#{m/r:^(pi|claude|opencode|codex)$,#{pane_current_command}}}'
# Strip only each agent's known decoration, never an arbitrary first word.
# Pi publishes @pi_title so native startup OSC writes cannot overwrite it.
# The OSC fallback also handles Pi without the extension ("π - directory").
# Codex emits just thread-name via its config.
set -g @pane_pi_title '#{?#{!=:#{@pi_title},},#{@pi_title},#{s|^π( -)? +||:pane_title}}'
set -g @pane_claude_title '#{s|^[✳◐◑] +||:pane_title}'
# Preserve the existing OpenCode title convention.
set -g @pane_opencode_title '#{s|^[^ ]+ +(- +)?||:pane_title}'
set -g @pane_agent_title '#{?#{==:#{pane_current_command},pi},#{E:@pane_pi_title},#{?#{==:#{pane_current_command},claude},#{E:@pane_claude_title},#{?#{==:#{pane_current_command},codex},#{pane_title},#{E:@pane_opencode_title}}}}'
set -g @pane_interesting_title '#{&&:#{E:@pane_is_agent},#{!=:#{E:@pane_agent_title},}}'
set -g @pane_window_name '#{?#{E:@pane_interesting_title},#{E:@pane_agent_title},#{s|^.*/||:#{E:@pane_border_path}}}'
set -g @pane_fallback_icon ''
if-shell '[ "$(uname -s)" = Darwin ]' 'set -g @pane_fallback_icon ""' 'set -g @pane_fallback_icon ""'
set -g @pane_agent_icon '#{?#{==:#{pane_current_command},pi},π,#{?#{==:#{pane_current_command},claude},✳,#{?#{==:#{pane_current_command},codex},>_,#{s|^([^ ]+) .*$|\1|:pane_title}}}}'
set -g @pane_border_icon '#{?#{E:@pane_interesting_title},#{E:@pane_agent_icon},#{E:@pane_fallback_icon}}'
set -g @pane_border_text '#{E:@pane_border_path}#{?#{E:@pane_interesting_title}, - #{E:@pane_agent_title},}'
set -g @pane_border_icon_padded ' #{E:@pane_border_icon} '
# Focus has a shape/weight cue, not just two similar colors: only the active
# pane gets a filled pill, enclosing its icon AND path/title. Inactive labels
# stay unfilled and muted. Reset before attention badges so bold/fill cannot leak.
set -g @pane_border_label '#{?pane_active,#[default]#[fg=#{@theme_accent}]#[bg=default]#[fg=#{@theme_background}]#[bg=#{@theme_accent}]#[bold]#{E:@pane_border_icon_padded}#{=/60/…:#{qh:#{E:@pane_border_text}}} #[default]#[fg=#{@theme_accent}]#[bg=default],#[default]#[fg=#{@theme_muted}]#[bg=default] #{E:@pane_border_icon_padded}#{=/60/…:#{qh:#{E:@pane_border_text}}}}'
set -g pane-border-format " #{E:@pane_border_label} #[default]#{?#{||:#{==:#{@attention_state},working},#{||:#{==:#{@attention_state},blocked},#{||:#{==:#{@attention_state},done},#{||:#{==:#{@attention_state},failed},#{==:#{@attention_state},unknown}}}}},#[align=right] #{T:@attention_pane},}"
set -g message-style "bg=default,fg=#{@theme_accent}"
set -g message-command-style "bg=default,fg=#{@theme_accent}"
set -g mode-style "bg=#{@theme_accent},fg=#{@theme_background}"
# Recheck only after every referenced format exists, including on live reload.
# Explicit per-window overrides from prefix+r still take precedence.
set -gw automatic-rename on

# tmux-attention registers formats and seen hooks on state/navigation use; no init.
# mise exec loads tools/preferences at invocation time, including linked dev installs
# that may not have a generated tmux-attention shim.
bind -N "Navigate panes by attention" a display-popup -E -d '#{pane_current_path}' -w 60% -h 60% 'mise exec -- tmux-attention panes'
bind -N "Navigate sessions and directories" A display-popup -E -d '#{pane_current_path}' -w 60% -h 60% 'mise exec -- tmux-attention'
bind -N "Jump to highest-attention pane" O run-shell 'mise exec -- tmux-attention jump'
bind -N "Toggle pane attention" h run-shell 'mise exec -- tmux-attention toggle "#{pane_id}"'

# Other plugins still use tpack; skip quietly before it has been installed.
set -g @plugin 'tmux-plugins/tmux-resurrect'
run -b 'if command -v tpack >/dev/null 2>&1; then tpack init; fi || true'
