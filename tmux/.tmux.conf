set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g allow-passthrough on
set -g base-index 1
set -g set-clipboard on
set -g history-limit 100000
set -g mouse off
set -g mode-keys vi
set -g prefix C-a
set -g focus-events on

source-file ~/.tmux/theme.conf

set-option -g status-position bottom

unbind C-b
unbind r
unbind -T copy-mode-vi Space;
unbind -T copy-mode-vi Enter;

bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux/bin/tmux-copy.sh"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind V run-shell '~/.tmux/bin/tmux-smart-split.sh -h "#{pane_id}"'
bind S run-shell '~/.tmux/bin/tmux-smart-split.sh -v "#{pane_id}"'
bind A popup -E -w 60% -h 60% "zsh -ic tm"
bind C run-shell '~/.tmux/bin/tmux-smart-split.sh -w "#{pane_id}"'
bind C-x kill-server
bind b popup -E -w 80% -h 80%
bind q killp
bind C-a send-prefix
bind C-j resize-pane -D 7
bind C-k resize-pane -U 7
bind C-h resize-pane -L 7
bind C-l resize-pane -R 7

# vim-tmux-navigator, hardcoded (nvim half stays a lazy.nvim plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# List of plugins
set -g @plugin 'git@github.com:jasonpearson/tmux-attention.git'
set -g @plugin "tmux-plugins/tmux-resurrect"

# tmux-attention conf options
set -g @attention_picker_key 'a'

set -gF pane-active-border-style "fg=#{@teal}"
set -gF pane-border-style "fg=#{@lavender}"
set -gF status-style "bg=#{@crust},fg=#{@fg}"
set -g window-status-format " #[fg=#{@teal},bg=#{@crust}] #{attention_window}#I #W "
set -g window-status-current-format " #[fg=#{@crust},bg=#{@teal}] #{attention_window}#I #W "
set -gF window-status-activity-style "bg=#{@lavender},fg=#{@crust}"
set -gF window-status-bell-style "bg=#{@yellow},fg=#{@crust}"
set -gF message-style "fg=#{@teal},bg=#{@crust},align=centre"
set -gF message-command-style "fg=#{@teal},bg=#{@crust},align=centre"
set -gF mode-style "bg=#{@surface_0},bold"
set -gF clock-mode-colour "#{@blue}"
set -gF menu-selected-style "fg=#{@fg},bold,bg=#{@overlay_0}"

set -g status-left-length 400
set -g status-right-length 400
set -g status-left "#[fg=#{?client_prefix,#{@red},#{@overlay_1}}] #{attention_global}[#S] #{?window_zoomed_flag,#[fg=#{@red}][Z]#[fg=#{@overlay_1}],} "
set -g status-right "#[fg=#{@overlay_1}] %a %b %d %H:%M %Z | #(TZ=UTC date +'%%a %%b %%d %%H:%%M %%Z') "
set -g pane-border-status top

run-shell '~/.tmux/bin/tmux-pane-border-format.sh'

run '~/.tmux/plugins/tpm/tpm'
