# Requires tmux-attention >= 0.5.0 (pinned in mise/config.toml).
# Reset both options on reload so other platforms cannot retain a macOS command.
set -g @attention_notify off
set -g @attention_notify_command ''

# Use macOS's built-in sound. Linux stays silent until a player/sound is chosen;
# stdout from notification commands is discarded, so no BEL fallback.
if-shell 'test "$(uname -s)" = Darwin && test -x /usr/bin/afplay && test -r /System/Library/Sounds/Submarine.aiff' {
    set -g @attention_notify always
    set -g @attention_notify_command '/usr/bin/afplay /System/Library/Sounds/Submarine.aiff'
}
