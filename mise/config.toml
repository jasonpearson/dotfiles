[dotfiles]
# bash
"~/.bash_profile" = { source = "~/repos/dotfiles/bash/bash_profile", mode = "symlink" }
"~/.bashrc" = { source = "~/repos/dotfiles/bash/bashrc", mode = "symlink" }
"~/.config/bash" = { source = "~/repos/dotfiles/bash/config", mode = "symlink-each" }

# ghostty
"~/.config/ghostty/config" = { source = "~/repos/dotfiles/ghostty/config", mode = "symlink" }

# git
"~/.config/git" = { source = "~/repos/dotfiles/git", mode = "symlink-each" }

# nvim
"~/.config/nvim" = { source = "~/repos/dotfiles/nvim", mode = "symlink-each" }

# starship
"~/.config/starship.toml" = { source = "~/repos/dotfiles/starship/starship.toml", mode = "symlink" }

# tmux
"~/.config/tmux/tmux.conf" = { source = "~/repos/dotfiles/tmux/tmux.conf", mode = "symlink" }
"~/.config/tmux/attention-notifications.conf" = { source = "~/repos/dotfiles/tmux/attention-notifications.conf", mode = "symlink" }
"~/.config/tmux-attention/config" = { source = "~/repos/dotfiles/tmux/tmux-attention-config", mode = "symlink" }

# claude
"~/.claude" = { source = "~/repos/dotfiles/agents/claude", mode = "symlink-each", exclude = ["settings.json"] }
"~/.claude/CLAUDE.md" = { source = "~/repos/dotfiles/agents/global-instructions.md", mode = "symlink" }
"~/.claude/settings.json" = { source = "~/repos/dotfiles/agents/claude/settings.json", mode = "copy" }

# pi
"~/.pi/agent/AGENTS.md" = { source = "~/repos/dotfiles/agents/global-instructions.md", mode = "symlink" }

# codex
"~/.codex/AGENTS.md" = { source = "~/repos/dotfiles/agents/global-instructions.md", mode = "symlink" }
"~/.codex/config.toml/tmux-title" = { source = "~/repos/dotfiles/agents/codex/tmux.toml", merge = true }
"~/.codex/config.toml/tmux-attention" = { source = "~/repos/dotfiles/agents/codex/attention.toml", merge = true }
"~/.codex/hooks.json" = { source = "~/repos/dotfiles/agents/codex/hooks.json", mode = "copy" }

# agent skills
"~/.agents/skills/agent-browser" = { source = "~/repos/dotfiles/agents/skills/agent-browser", mode = "symlink" }
"~/.agents/skills/ammend-commits" = { source = "~/repos/dotfiles/agents/skills/ammend-commits", mode = "symlink" }
"~/.agents/skills/hunk-review" = { source = "~/repos/dotfiles/agents/skills/hunk-review", mode = "symlink" }
"~/.agents/skills/playwright-cli" = { source = "~/repos/dotfiles/agents/skills/playwright-cli", mode = "symlink" }
"~/.agents/skills/recommit" = { source = "~/repos/dotfiles/agents/skills/recommit", mode = "symlink" }
"~/.agents/skills/web-search" = { source = "~/repos/dotfiles/agents/skills/web-search", mode = "symlink" }

# claude skills
"~/.claude/skills/agent-browser" = { source = "~/repos/dotfiles/agents/skills/agent-browser", mode = "symlink" }
"~/.claude/skills/ammend-commits" = { source = "~/repos/dotfiles/agents/skills/ammend-commits", mode = "symlink" }
"~/.claude/skills/hunk-review" = { source = "~/repos/dotfiles/agents/skills/hunk-review", mode = "symlink" }
"~/.claude/skills/playwright-cli" = { source = "~/repos/dotfiles/agents/skills/playwright-cli", mode = "symlink" }
"~/.claude/skills/recommit" = { source = "~/repos/dotfiles/agents/skills/recommit", mode = "symlink" }
"~/.claude/skills/web-search" = { source = "~/repos/dotfiles/agents/skills/web-search", mode = "symlink" }

[tools]
claude = "latest"
codex = "latest"
fzf = "0.74.4"
github-cli = "2.101.0"
"github:jasonpearson/tmux-attention" = "0.5.0"
hunk = "0.22.0"
jq = "1.8.2"
lazygit = "0.65.1"
lua-language-server = "3.19.1"
mosh = "latest"
neovim = "0.12.5"
node = "24.21.0"
"npm:@playwright/cli" = "0.1.21"
"npm:agent-browser" = "0.38.1"
"npm:skills" = "1.7.0"
"npm:typescript" = "5.9.3"
"npm:typescript-language-server" = "6.0.1"
pi = "latest"
"pypi:ddgs" = "9.16.0"
python = "3.14.7"
ripgrep = "15.2.0"
starship = "1.26.0"
tmux = "3.7c"
tree-sitter = "0.26.1"
uv = "0.12.19"
yq = "4.53.6"
zoxide = "0.10.0"
