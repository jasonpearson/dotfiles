
[bootstrap.packages]
"pacman:ghostty" = { os = "linux" }
"pacman:git" = { os = "linux" }
"pacman:tailscale" = { os = "linux" }
"pacman:ttf-hack-nerd" = { os = "linux" }


[dotfiles]
"~/.config/omarchy/hooks/theme-set.d/tmux-accent" = { source = "~/repos/dotfiles/theme/tmux-omarchy.bash", mode = "symlink" }
"~/.config/omarchy/hooks/theme-set.d/starship" = { source = "~/repos/dotfiles/theme/starship-omarchy.hook", mode = "symlink" }
"~/.config/hypr" = { source = "~/repos/dotfiles/hypr", mode = "symlink-each" }
